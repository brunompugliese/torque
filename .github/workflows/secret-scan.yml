name: Secret scan

# Scans only the commits a PR adds, so credentials that were already removed
# and rotated in older history don't fail every run.

on:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan PR commits
        run: gitleaks git --redact --verbose --log-opts="origin/${{ github.base_ref }}..HEAD" .
